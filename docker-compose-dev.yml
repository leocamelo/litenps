# Local development database only. This is not a deployment artifact:
# docs/ARCHITECTURE.md §3 rules out a maintained compose file for self-hosting.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Loopback only. Without the explicit 127.0.0.1, Docker publishes on
      # 0.0.0.0 (and ::), so a database whose password is "postgres" is
      # reachable from anything on the same network.
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
